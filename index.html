<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewerNeo Project</title>
    <meta name="theme-color" content="#0b0f14">
    <script>
      // Apply saved theme *before* first paint (prevents flash).
      (() => {
        try {
          const key = 'viewerneo_theme';
          const saved = localStorage.getItem(key);
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <script type="module" src="./ThumbnailGallery/thumbnail-pane.js"></script>
    <script async src="./lib/opencv.js"></script>
    <script type="module" src="./lib/opencv-manager.js"></script>
    <script src="./lib/tiff.js"></script>
    <!-- PDF drop support is vendored into ./lib (see pdf-support.js). -->
    <link rel="stylesheet" href="./WindowsManager/style.css">
    <link rel="stylesheet" href="grid_viewer_style.css">
    <link rel="stylesheet" href="./app.css">
    <script type="module" src="grid_viewer_controls.js"></script>
</head>
<body>
    <div id="top-function-bar" class="app-topbar">
        <div class="app-brand">
            <div class="app-logo" aria-hidden="true">VN</div>
            <div class="app-title">
                <div class="app-name">ViewerNeo</div>
                <div class="app-subtitle">Paste or drop images • Open the thumbnail panel • Launch Grid Viewer</div>
            </div>
        </div>
        <div class="app-actions">
            <button type="button" class="btn btn-ghost" id="toggle-panel-btn">Thumbnails</button>
            <button type="button" class="btn btn-primary" id="grid-viewer-btn">Grid viewer</button>
            <label class="sr-only" for="theme-select">Theme</label>
            <select id="theme-select" class="select" title="Theme">
                <option value="system">System</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
    </div>

    <div id="content-below-topbar">
        <div class="thumbnail-panel-placeholder">
            <thumbnail-pane id="my-thumbnail-panel" opened></thumbnail-pane>
        </div>
        <div id="main-content">
            <div class="workspace-shell">
                <div class="workspace-empty">
                    <div class="workspace-empty-card">
                        <h1>Drop images to start</h1>
                        <p>
                            Drag & drop image files/folders anywhere, or paste from clipboard.
                            Then click <span class="kbd">Grid viewer</span> to open the workspace window.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./app/main.js"></script>
</body>
</html>
